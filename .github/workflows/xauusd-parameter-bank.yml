name: XAUUSD Adaptive Condition Bank
on:
  push:
    paths:
      - 'research/parameter_bank/build_bank.py'
      - 'research/parameter_bank/test_playbooks.py'
      - 'research/parameter_bank/make_docs.py'
      - '.github/workflows/xauusd-parameter-bank.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'numba>=0.60,<0.65'
      - name: Compute 43 non-lookahead market features
        run: python 'research/parameter_bank/build_bank.py'
      - name: Run 16 composite playbooks and 96 management variants
        run: python 'research/parameter_bank/test_playbooks.py'
      - name: Build parameter dictionary and scenario report
        run: python 'research/parameter_bank/make_docs.py'
      - name: Verify event-independent outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          P=Path('research/parameter_bank')
          a=pd.read_csv(P/'condition_bank_m5.csv')
          b=pd.read_csv(P/'composite_prototypes_96.csv')
          c=pd.read_csv(P/'prototypes_fixed4R_comparison.csv')
          d=pd.read_csv(P/'prototype_trade_log.csv')
          cnt=json.loads((P/'condition_prevalence.json').read_text())
          assert len(a)==75264,(len(a),75264)
          assert len(cnt['by_parameter'])==43
          assert len(b)==96 and b.playbook.nunique()==16
          assert len(c)==16 and len(d)>1000
          assert set(a.entry_date.str[:4])=={'2025','2026'}
          assert (pd.to_datetime(a.entry_israel,utc=True).dt.hour>=0).all()
          assert c.review_REUSED_avg_R.max()<1
          print('PASS: full-market features, all rule studies and trade logs.')
          PY
      - name: Commit complete analysis data and documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'research/parameter_bank/'
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish adaptive XAUUSD condition bank, 16 playbooks, 96 tests'
            git push
          fi
