name: Enrich 5M ATR Events
on:
  push:
    paths:
      - 'research/5M ATR/enrich_events.py'
      - '.github/workflows/enrich-5m-atr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Generate all 4584 event context records
        run: python 'research/5M ATR/enrich_events.py'
      - name: Commit validated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'research/5M ATR/all_4584_event_context.csv' 'research/5M ATR/event_context_ranked.csv' 'research/5M ATR/event_context_summary.json'
          if ! git diff --cached --quiet; then
            git commit -m 'research(5M ATR): save per-event features and aggregate frequency'
            git push
          fi
