name: XAUUSD Reaction-First Structural Entries
on:
  push:
    paths:
      - 'research/structural_strategy_lab/research.py'
      - 'research/structural_strategy_lab/limit_retest.py'
      - '.github/workflows/xauusd-structural-strategy.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'numba>=0.60,<0.65'
      - name: Replay market-entry strategies
        run: python 'research/structural_strategy_lab/research.py'
      - name: Replay retracement-limit strategies
        run: python 'research/structural_strategy_lab/limit_retest.py'
      - name: Assert complete and executable results
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('research/structural_strategy_lab')
          a=pd.read_csv(p/'all_variants.csv')
          b=pd.read_csv(p/'limit_all_variants.csv')
          c=pd.read_csv(p/'candidate_PD_H1_limit_trade_log.csv')
          s=pd.read_csv(p/'train_selected_by_family.csv')
          assert len(a)==1530
          assert len(b)==240
          assert len(s)==16
          assert len(c)==194
          assert c.duration_minutes.max()<=120
          local=pd.to_datetime(c.fill_israel,utc=True).dt.tz_convert('Asia/Jerusalem')
          assert ((local.hour>=6)&(local.hour<20)&(local.weekday<5)).all()
          assert (c.original_risk_price_usd>=0.65).all()
          assert c.period.nunique()==3
          print('PASS: 1530 market variants, 240 limits, 194 detailed candidate fills')
          PY
      - name: Commit full logs, raw trial tables and robustness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'research/structural_strategy_lab/'
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish full M1 structural stop and limit-fill strategy study'
            git push
          fi
