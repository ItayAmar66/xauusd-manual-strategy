name: Build 5M ATR Research
on:
  push:
    paths:
      - 'research/5M ATR/build.py'
      - '.github/workflows/build-5m-atr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy
      - name: Rebuild research
        run: python 'research/5M ATR/build.py'
      - name: Commit generated research CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'research/5M ATR/XAUUSD_Reversal_Legs_4ATR_M5.csv' 'research/5M ATR/daily_coverage.csv' 'research/5M ATR/summary.json'
          if ! git diff --cached --quiet; then
            git commit -m "research(5M ATR): publish generated 4ATR results"
            git push
          fi
