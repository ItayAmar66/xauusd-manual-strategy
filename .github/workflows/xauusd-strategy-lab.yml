name: XAUUSD 26 Strategy Lab
on:
  push:
    paths:
      - 'research/strategy_lab/backtest.py'
      - 'research/strategy_lab/reports.py'
      - '.github/workflows/xauusd-strategy-lab.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/xauusd-strategy-lab.yml'
      - name: Install numerics
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'numba>=0.60,<0.65'
      - name: Run 1,170 strategy variants
        run: python 'research/strategy_lab/backtest.py'
      - name: Produce 26 detailed strategy reports
        run: python 'research/strategy_lab/reports.py'
      - name: Assert outputs are complete
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('research/strategy_lab')
          a=pd.read_csv(p/'all_1170_variants.csv')
          b=pd.read_csv(p/'selected_26_strategies.csv')
          t=pd.read_csv(p/'all_selected_trades.csv')
          c=pd.read_csv(p/'LEADERBOARD_holdout.csv')
          assert (len(a),len(b),len(c))==(1170,26,26)
          assert len(list((p/'strategies').glob('*.md')))==26
          assert len(t)>20000
          assert (t['entry_il'].str.contains('Asia/Jerusalem')).sum()==0
          print('PASS 1170 / 26 / 26 and',len(t),'trades')
          PY
      - name: Commit all generated research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'research/strategy_lab/'
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish 1170 trials, trade logs and 26 detailed strategy reports'
            git push
          fi
