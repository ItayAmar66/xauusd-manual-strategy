name: XAUUSD Multi-Strategy Portfolio Research
on:
  push:
    paths:
      - 'research/portfolio_search/*.py'
      - '.github/workflows/xauusd-portfolio-search.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'numba==0.65.1'
      - name: Screen 20302 conditions against full original XAUUSD M1 tape
        run: python 'research/portfolio_search/explore.py'
      - name: Select portfolio using 2025 data only
        run: python 'research/portfolio_search/portfolio.py'
      - name: Quantify costs, drawdowns, and week-block uncertainty
        run: python 'research/portfolio_search/qa_report.py'
      - name: Validate full-market signal and no-overlap claims
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          root=Path('research/portfolio_search')
          a=pd.read_csv(root/'serial_screen_all.csv')
          x=pd.read_csv(root/'portfolio_with_daily_fallback_trade_log.csv')
          y=pd.read_csv(root/'portfolio_without_fallback_trade_log.csv')
          q=pd.read_csv(root/'QA_cost_stress_bootstrap.csv')
          s=json.loads((root/'portfolio_summary.json').read_text())
          assert len(a)>5000
          assert len(s['selected_2025_only'])==4
          assert len(x)>900 and len(y)>400
          assert len(q)==6
          assert (x.entry_m1_index.iloc[1:].to_numpy()>x.exit_m1_index.iloc[:-1].to_numpy()).all()
          assert (y.entry_m1_index.iloc[1:].to_numpy()>y.exit_m1_index.iloc[:-1].to_numpy()).all()
          assert (x.duration_minutes<=120).all()
          assert (y.duration_minutes<=120).all()
          assert x[x.date_israel>='2026-04-01'].net_R.mean()<0
          assert (x[x.date_israel>='2026-04-01'].date_israel.nunique())==126
          print('PASS: full M1 playback, 4 entry strategies, one daily fallback, every trade logged, 2026 decline disclosed')
          PY
      - name: Commit reproducible findings; omit 39MB temporary counterfactual cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'research/portfolio_search/'*.csv 'research/portfolio_search/'*.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: publish 20302-condition search, combined portfolio, trade logs and stress tests'
            git pull --rebase origin main
            git push
          fi
